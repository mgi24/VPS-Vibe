{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <img src="/assets/mmvlogo.png" alt="MMV" class="auth-logo">
        <h2>Masuk ke MMV</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <p class="error-msg" id="loginError"></p>
            <button type="submit">Masuk</button>
        </form>
        <p class="auth-link">Belum punya akun? <a href="/register">Daftar</a></p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const err = document.getElementById('loginError');
    try {
        const data = await api('/api/login', {
            method: 'POST',
            body: { username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value },
        });
        window.location.href = '/';
    } catch (e) {
        err.textContent = e.message;
    }
});
</script>
{% endblock %}
