.card p{color:#94a3b8;font-size:.95rem;line-height:1.5}
.tag{display:inline-block;margin-top:1rem;padding:4px 14px;border:1px solid #00d4aa44;border-radius:20px;font-size:.75rem;color:#00d4aa;background:#00d4aa11}
