<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/mmvlogo.png">
<title>Admin - MMV VPN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;margin:0}

nav{background:#111;padding:10px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:12px}
.nav-logo{width:36px;height:36px;border-radius:50%;object-fit:cover}
.nav-title{font-size:1.2rem;font-weight:700;color:#fff;text-decoration:none}
.nav-title span{color:#00d4aa}
.nav-links{display:flex;gap:4px}
.nav-links a{color:#aaa;text-decoration:none;padding:8px 16px;font-size:.9rem;border:1px solid transparent;border-radius:6px;transition:all .25s}
.nav-links a:hover,.nav-links a.active{color:#fff;border-color:#00d4aa;background:#00d4aa14}
.main{padding:2rem 1rem}
.card{background:#1e293b;border-radius:16px;padding:2rem;max-width:720px;width:100%;box-shadow:0 25px 50px -12px #00000080;margin:0 auto}
.card h1{margin-bottom:1.5rem;font-size:1.25rem}
.stats{display:flex;gap:1rem;margin-bottom:1.5rem}
.stat{background:#334155;padding:1.25rem;border-radius:12px;flex:1;text-align:center}
.stat .label{font-size:.8rem;color:#94a3b8}
.stat .num{font-size:1.75rem;font-weight:700;color:#00d4aa;margin-top:.25rem}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:8px;overflow:hidden}
th{background:#334155;padding:.75rem;text-align:left;font-size:.8rem;color:#94a3b8;font-weight:600}
td{padding:.75rem;border-top:1px solid #334155;font-size:.85rem}
tr:hover{background:#33415566}
.back{display:inline-block;margin-top:1rem;color:#00d4aa;text-decoration:none;font-size:.85rem;font-weight:500}
.back:hover{text-decoration:underline}
@media(max-width:600px){nav{padding:10px 16px;flex-wrap:wrap;gap:8px}.nav-links a{font-size:.8rem;padding:6px 10px}.stats{flex-direction:column}.card{padding:1.5rem}}
</style>
</head>
<body>

<nav>
<div class="nav-left">
<img src="/assets/mmvlogo.png" alt="MMV" class="nav-logo">
<a href="https://misbahwork.my.id" class="nav-title"><span>MMV</span> VPN</a>
</div>
<div class="nav-links">
<a href="/">Wireguard</a>
<a href="/ssh">SSH</a>
</div>
</nav>

<div class="main">
<div class="card">
<h1>Admin Panel</h1>
<div class="stats">
<div class="stat"><div class="label">Total Akun</div><div class="num">{{ total }}</div></div>
<div class="stat"><div class="label">Hari Ini</div><div class="num">{{ daily }} / {{ max_daily }}</div></div>
</div>
<table>
<tr><th>ID</th><th>Username</th><th>IP Address</th><th>Dibuat</th></tr>
{% for a in accounts %}
<tr><td>{{ a.id }}</td><td>{{ a.username or '-' }}</td><td>{{ a.address }}</td><td>{{ a.created_at }}</td></tr>
{% endfor %}
</table>
<a href="/" class="back">&larr; Kembali</a>
</div>
</div>

</body>
</html>
