<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin - WireGuard Free</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0f172a;color:#e2e8f0;padding:2rem}
h1{margin-bottom:1.5rem;font-size:1.25rem}
.stats{display:flex;gap:1rem;margin-bottom:1.5rem}
.stat{background:#1e293b;padding:1.25rem;border-radius:12px;flex:1;text-align:center}
.stat .label{font-size:.8rem;color:#94a3b8}
.stat .num{font-size:1.75rem;font-weight:700;color:#38bdf8;margin-top:.25rem}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:8px;overflow:hidden}
th{background:#334155;padding:.75rem;text-align:left;font-size:.8rem;color:#94a3b8;font-weight:600}
td{padding:.75rem;border-top:1px solid #334155;font-size:.85rem}
tr:hover{background:#33415566}
</style>
</head>
<body>
<h1>Admin Panel</h1>
<div class="stats">
<div class="stat"><div class="label">Total Akun</div><div class="num">{{ total }}</div></div>
<div class="stat"><div class="label">Hari Ini</div><div class="num">{{ daily }} / {{ max_daily }}</div></div>
</div>
<table>
<tr><th>ID</th><th>Username</th><th>IP Address</th><th>Dibuat</th></tr>
{% for a in accounts %}
<tr><td>{{ a.id }}</td><td>{{ a.username or '-' }}</td><td>{{ a.address }}</td><td>{{ a.created_at }}</td></tr>
{% endfor %}
</table>
</body>
</html>
