<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Config Saya - WireGuard Free</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:1rem}
.card{background:#1e293b;border-radius:16px;padding:2rem;max-width:520px;width:100%;box-shadow:0 25px 50px -12px #00000080}
h1{font-size:1.25rem;margin-bottom:.25rem}
.date{color:#94a3b8;font-size:.85rem;margin-bottom:1.25rem}
.item{background:#334155;border-radius:8px;padding:.75rem 1rem;margin-bottom:.5rem;display:flex;align-items:center;justify-content:space-between}
.item .addr{font-weight:600;font-size:.9rem}
.item .time{color:#94a3b8;font-size:.75rem}
.dl{background:#3b82f6;color:#fff;padding:.35rem .75rem;border-radius:6px;text-decoration:none;font-size:.8rem;transition:background .2s}
.dl:hover{background:#2563eb}
.empty{text-align:center;padding:2rem 0;color:#64748b;font-size:.9rem}
.back{display:inline-block;margin-top:1rem;color:#3b82f6;text-decoration:none;font-size:.85rem}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
<h1>Config Saya</h1>
<p class="date">Hari ini &mdash; {{ today_str }}</p>

{% if configs %}
{% for c in configs %}
<div class="item">
<div>
<div class="addr">{{ c.address }}</div>
<div class="time">{{ c.created_at }}</div>
</div>
{% set fname = 'wgfree_' ~ c.address.replace('.', '_') ~ '.conf' %}
<a href="/download/{{ fname }}" class="dl">Download</a>
</div>
{% endfor %}
{% else %}
<div class="empty">Belum ada config hari ini.</div>
{% endif %}

<a href="/" class="back">&larr; Kembali</a>
</div>
</body>
</html>
