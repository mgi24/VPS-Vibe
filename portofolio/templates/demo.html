{% extends "base.html" %}

{% block content %}
<div class="container">

  <div class="card card-network">
    <div class="card-body">
      <div class="network-title">Network Infrastructure</div>
      <div class="network-grid">
        <div class="network-left">
          <div class="powered-by">Powered by Oracle</div>
          <img src="/static/oracle_logo.png" alt="Oracle" class="oracle-logo">
        </div>
        <div class="network-right">
          <div class="speed-gauges">
            <div class="gauge-box">
              <div class="gauge-svg-wrap">
                <svg class="gauge-svg" viewBox="0 0 140 80">
                  <path d="M 10 75 A 60 60 0 0 1 130 75"
                    fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
                  <path id="cpu-arc" d="M 10 75 A 60 60 0 0 1 130 75"
                    fill="none" stroke="#00d4aa" stroke-width="10" stroke-linecap="round"
                    stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
                </svg>
                <div class="gauge-readout">
                  <span class="gauge-pct" id="cpu-pct">0</span><span class="gauge-pct-unit">%</span>
                </div>
              </div>
              <div class="gauge-name">4 Arm 64 CPU</div>
            </div>
            <div class="gauge-box">
              <div class="gauge-svg-wrap">
                <svg class="gauge-svg" viewBox="0 0 140 80">
                  <path d="M 10 75 A 60 60 0 0 1 130 75"
                    fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
                  <path id="ram-arc" d="M 10 75 A 60 60 0 0 1 130 75"
                    fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"
                    stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
                </svg>
                <div class="gauge-readout">
                  <span class="gauge-pct" id="ram-pct">0</span><span class="gauge-pct-unit">%</span>
                </div>
              </div>
              <div class="gauge-name" id="ram-label">RAM <span class="gauge-ram-detail" id="ram-detail">0.0 / 0.0 GB</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card card-demo-page">
    <div class="card-body">
      <div class="demo-grid">
        <div class="demo-left">
          <div class="demo-title"><strong>{{ content.demo_title }}</strong></div>
          <div class="demo-desc">{{ content.demo_desc }}</div>
        </div>
        <a href="https://object.2b2t.my.id" target="_blank" class="demo-btn">
          {{ content.demo_button }}
        </a>
      </div>
    </div>
  </div>

</div>

<script>
(function() {
  const ARC = 188.5;

  const cpuArc = document.getElementById('cpu-arc');
  const ramArc = document.getElementById('ram-arc');
  const cpuPct = document.getElementById('cpu-pct');
  const ramPct = document.getElementById('ram-pct');
  const ramDetail = document.getElementById('ram-detail');

  async function fetchResource() {
    try {
      const res = await fetch('/resource');
      const d = await res.json();
      cpuArc.setAttribute('stroke-dashoffset', ARC * (1 - d.cpu / 100));
      ramArc.setAttribute('stroke-dashoffset', ARC * (1 - d.ram_percent / 100));
      cpuPct.textContent = d.cpu;
      ramPct.textContent = d.ram_percent;
      ramDetail.textContent = d.ram_used_gb + ' / ' + d.ram_total_gb + ' GB';
    } catch (_) {}
  }

  fetchResource();
  setInterval(fetchResource, 1000);
})();
</script>
{% endblock %}
