<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#e94560;--accent2:#5b8def;--text:#e0e0e0;--text2:#6a6a8a;--green:#0ceda0;--border:#1a1a4e}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;height:100vh;overflow:hidden}
input,button,select,textarea{font-family:inherit}
/* Login Overlay */
#login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000}
#login-overlay.show{display:flex}
#login-form{background:var(--surface);padding:32px;border-radius:12px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
#login-form h2{margin-bottom:24px;font-size:22px;font-weight:600;text-align:center;color:#fff}
#login-form input{width:100%;padding:12px 14px;margin-bottom:12px;background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:6px;font-size:15px;outline:none;transition:border-color 0.2s}
#login-form input:focus{border-color:var(--accent)}
#login-form button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px;font-weight:600;transition:background 0.2s;margin-top:4px}
#login-form button:hover{background:#d63850}
#login-form .error{color:var(--accent);margin-bottom:12px;display:none;font-size:13px;text-align:center}
#login-form .status{color:var(--text2);margin-bottom:12px;display:none;font-size:13px;text-align:center}
/* Layout */
#app{display:none;height:100vh}
#app.show{display:flex}
/* Sidebar */
#sidebar{width:220px;min-width:220px;background:var(--surface);display:flex;flex-direction:column;border-right:1px solid var(--border)}
#sidebar-header{padding:20px 16px;font-size:16px;font-weight:700;color:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#sidebar-header .logo{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block}
#sidebar-user{padding:10px 16px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border)}
#sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px;transition:all 0.15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-item.active{background:rgba(233,69,96,0.12);color:var(--accent);border-left-color:var(--accent)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
#sidebar-logout{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;border-top:1px solid var(--border);transition:color 0.15s}
#sidebar-logout:hover{color:var(--accent)}
/* Main Content */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#main-header{padding:16px 24px;border-bottom:1px solid var(--border);font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;min-height:60px}
#main-content{flex:1;padding:20px 24px;overflow-y:auto}
/* Overview */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.overview-card{background:var(--surface);border-radius:8px;padding:16px;border:1px solid var(--border)}
.overview-card h3{font-size:13px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.overview-card pre{font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-all;font-family:'Consolas','Courier New',monospace;line-height:1.5}
/* iptables */
.iptables-section{margin-bottom:24px}
.section-header{font-size:16px;font-weight:700;color:#fff;padding:10px 16px;background:var(--surface);border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;display:flex;align-items:center;gap:8px}
.section-header .badge{font-size:11px;background:var(--accent2);padding:2px 8px;border-radius:10px;color:#fff;font-weight:600}
.chain-card{background:var(--surface);border:1px solid var(--border);border-top:none;margin-bottom:2px}
.chain-card:last-child{border-radius:0 0 8px 8px;margin-bottom:0}
.chain-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface2);font-weight:600;font-size:13px;color:var(--accent2);border-bottom:1px solid var(--border)}
.chain-header .chain-actions{display:flex;gap:6px}
.chain-header .chain-actions button{padding:4px 10px;background:var(--accent2);border:none;color:#fff;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;transition:opacity 0.15s}
.chain-header .chain-actions button:hover{opacity:0.8}
.chain-header .chain-actions button.add-btn{background:var(--green);color:#000}
.rule-table{width:100%;border-collapse:collapse;font-size:11px;font-family:'Consolas','Courier New',monospace}
.rule-table th{padding:7px 8px;text-align:left;background:var(--surface);color:var(--text2);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.3px;border-bottom:1px solid var(--border);white-space:nowrap}
.rule-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text);white-space:nowrap}
.rule-table tr:hover td{background:rgba(255,255,255,0.03)}
.rule-table tr:last-child td{border-bottom:none}
.rule-table .col-edit{text-align:center}
.rule-table .edit-btn{padding:3px 8px;background:var(--accent2);border:none;color:#fff;border-radius:3px;font-size:10px;cursor:pointer;font-weight:600;transition:opacity 0.15s}
.rule-table .edit-btn:hover{opacity:0.8}
.rule-table .col-target{font-weight:600}
.rule-target-ACCEPT{color:var(--green)}
.rule-target-DROP{color:var(--accent)}
.rule-target-REJECT{color:#f0a030}
.rule-target-MASQUERADE{color:#a78bfa}
.rule-target-DNAT{color:#60a5fa}
.rule-target-SNAT{color:#f472b6}
.rule-target-LOG{color:var(--text2)}
.iptables-empty{padding:16px;text-align:center;color:var(--text2);font-size:12px}
.iptables-controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.iptables-controls button{padding:8px 14px;background:var(--accent2);border:1px solid var(--border);color:#fff;border-radius:6px;font-size:13px;font-weight:600;outline:none;cursor:pointer;transition:opacity 0.15s}
.iptables-controls button:hover{opacity:0.85}
/* Rule Form (add/edit) */
.rule-form-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:999}
.rule-form-overlay.show{display:flex}
.rule-form{background:var(--surface);border-radius:12px;padding:24px;width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.rule-form h4{font-size:14px;color:var(--text2);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px}
.rule-form .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rule-form .form-row input,.rule-form .form-row select{flex:1;min-width:100px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:6px;font-size:13px;outline:none}
.rule-form .form-row input:focus,.rule-form .form-row select:focus{border-color:var(--accent2)}
.rule-form .form-row .field-label{font-size:11px;color:var(--text2);width:100%;margin-bottom:-4px;margin-top:4px}
.rule-form .form-row button{padding:8px 20px;background:var(--green);color:#000;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
.rule-form .form-row button:hover{opacity:0.85}
.rule-form .form-row button.cancel{background:var(--text2);color:#fff}
.rule-form .form-row button.danger{background:var(--accent);color:#fff}
.rule-form .form-note{font-size:11px;color:var(--text2);margin-top:8px;text-align:center}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent2)}
/* Loading */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--text2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Service Tab */
.svc-controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.svc-controls button{padding:8px 14px;background:var(--accent2);border:1px solid var(--border);color:#fff;border-radius:6px;font-size:13px;font-weight:600;outline:none;cursor:pointer;transition:opacity 0.15s}
.svc-controls button:hover{opacity:0.85}
.svc-controls button.svc-add-btn{background:var(--green);color:#000}
.svc-table{width:100%;border-collapse:collapse;font-size:13px}
.svc-table th{padding:10px 12px;text-align:left;background:var(--surface);color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;border-bottom:1px solid var(--border)}
.svc-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text)}
.svc-table tr:hover td{background:rgba(255,255,255,0.03)}
.svc-table .svc-td-name{font-family:'Consolas','Courier New',monospace;font-weight:600;color:#fff}
.svc-table .svc-td-desc{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.svc-check{font-size:16px;line-height:1}
.svc-check.yes{color:var(--green)}
.svc-check.no{color:var(--accent)}
.svc-drop-wrap{position:relative;display:inline-block}
.svc-drop-btn{padding:5px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:4px}
.svc-drop-btn:hover{border-color:var(--accent2);color:#fff}
.svc-drop-btn .arrow{font-size:8px}
.svc-drop-menu{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:6px;min-width:150px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4);overflow:hidden}
.svc-drop-menu.show{display:block}
.svc-drop-item{padding:8px 14px;font-size:12px;color:var(--text);cursor:pointer;transition:background 0.1s;white-space:nowrap}
.svc-drop-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.svc-drop-item.danger{color:var(--accent)}
.svc-drop-item.danger:hover{background:rgba(233,69,96,0.1)}
.svc-drop-sep{height:1px;background:var(--border);margin:2px 0}
.svc-config{display:none;margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.svc-config.show{display:block}
.svc-config pre{padding:12px 14px;font-size:11px;color:var(--text);white-space:pre-wrap;word-break:break-all;font-family:'Consolas','Courier New',monospace;line-height:1.5;margin:0;max-height:400px;overflow-y:auto}
.svc-config .svc-config-src{padding:6px 14px;font-size:10px;color:var(--text2);border-bottom:1px solid var(--border);background:var(--surface)}
.svc-empty{padding:32px;text-align:center;color:var(--text2);font-size:13px}
/* Service Add Modal */
.svc-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:999}
.svc-modal-overlay.show{display:flex}
.svc-modal{background:var(--surface);border-radius:12px;padding:24px;width:560px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.svc-modal h4{font-size:14px;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.svc-modal-search{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:6px;font-size:13px;outline:none;margin-bottom:12px}
.svc-modal-search:focus{border-color:var(--accent2)}
.svc-modal-list{flex:1;overflow-y:auto;max-height:50vh}
.svc-modal-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;cursor:pointer;transition:background 0.1s;font-size:13px}
.svc-modal-item:hover{background:rgba(255,255,255,0.05)}
.svc-modal-item .svc-modal-name{font-family:'Consolas','Courier New',monospace;color:var(--text);font-size:12px}
.svc-modal-item .svc-modal-state{font-size:10px;color:var(--text2)}
.svc-modal-item .svc-modal-add{padding:4px 10px;background:var(--green);color:#000;border:none;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;transition:opacity 0.15s}
.svc-modal-item .svc-modal-add:hover{opacity:0.8}
.svc-modal-item.svc-already .svc-modal-add{background:var(--text2);color:#fff;cursor:default;opacity:0.5}
.svc-modal-close{margin-top:12px;padding:8px 20px;background:var(--text2);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-end}
.svc-modal-close:hover{opacity:0.85}
/* Docker Tab */
.docker-empty{padding:32px;text-align:center;color:var(--text2);font-size:13px}
.docker-config{display:none;margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.docker-config.show{display:block}
.docker-config pre{padding:12px 14px;font-size:11px;color:var(--text);white-space:pre-wrap;word-break:break-all;font-family:'Consolas','Courier New',monospace;line-height:1.5;margin:0;max-height:500px;overflow-y:auto}
.docker-state{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}
.docker-state.running{background:rgba(12,237,160,0.15);color:var(--green)}
.docker-state.exited{background:rgba(233,69,96,0.15);color:var(--accent)}
.docker-state.paused{background:rgba(240,160,48,0.15);color:#f0a030}
.docker-state.created{background:rgba(91,141,239,0.15);color:var(--accent2)}
</style>
</head>
<body>

<div id="login-overlay" class="show">
  <div id="login-form">
    <h2>VPS Manager Login</h2>
    <div class="error" id="login-error">Please enter your credentials</div>
    <div class="status" id="login-status" style="display:none">Logging in...</div>
    <input type="text" id="login-username" placeholder="Username" autocomplete="off">
    <input type="password" id="login-password" placeholder="Password" autocomplete="off">
    <button id="login-btn">Login</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header"><span class="logo"></span> VPS Manager</div>
    <div id="sidebar-user"></div>
    <div id="sidebar-nav">
      <div class="nav-item active" data-tab="overview"><span class="icon">&#9679;</span> Overview</div>
      <div class="nav-item" data-tab="iptables"><span class="icon">&#9632;</span> iptables</div>
      <div class="nav-item" data-tab="services"><span class="icon">&#9776;</span> Services</div>
      <div class="nav-item" data-tab="docker"><span class="icon">&#9881;</span> Docker</div>
    </div>
    <div id="sidebar-logout">&#8592; Logout</div>
  </div>
  <div id="main">
    <div id="main-header"></div>
    <div id="main-content">
      <div id="tab-overview"></div>
      <div id="tab-iptables" style="display:none"></div>
      <div id="tab-services" style="display:none"></div>
      <div id="tab-docker" style="display:none"></div>
    </div>
  </div>
</div>

<div class="svc-modal-overlay" id="svc-modal-overlay">
  <div class="svc-modal">
    <h4>Add Service to Monitor</h4>
    <input type="text" class="svc-modal-search" id="svc-modal-search" placeholder="Search services...">
    <div class="svc-modal-list" id="svc-modal-list"></div>
    <button class="svc-modal-close" id="svc-modal-close">Close</button>
  </div>
</div>

<script>
let authToken = localStorage.getItem('vpsm_token');
let currentTab = 'overview';
let iptablesDeleteMode = false;

async function checkAuth() {
  if (!authToken) { showLogin(); return false; }
  try {
    const res = await fetch('/api/me?token=' + encodeURIComponent(authToken));
    if (!res.ok) { authToken = null; localStorage.removeItem('vpsm_token'); showLogin(); return false; }
    const data = await res.json();
    if (!data.authenticated) { authToken = null; localStorage.removeItem('vpsm_token'); showLogin(); return false; }
    document.getElementById('sidebar-user').textContent = data.username;
    showApp();
    return true;
  } catch(e) {
    showLogin();
    return false;
  }
}

function showLogin() {
  document.getElementById('login-overlay').classList.add('show');
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-username').focus();
}

function showApp() {
  document.getElementById('login-overlay').classList.remove('show');
  document.getElementById('app').classList.add('show');
  switchTab('overview');
}

async function doLogin(username, password) {
  const formData = new FormData();
  formData.append('username', username);
  formData.append('password', password);
  const statusEl = document.getElementById('login-status');
  const errorEl = document.getElementById('login-error');
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<span class="spinner"></span> Authenticating...';
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/api/login', { method: 'POST', body: formData });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Login failed');
    }
    const data = await res.json();
    authToken = data.token;
    localStorage.setItem('vpsm_token', authToken);
    statusEl.style.display = 'none';
    document.getElementById('sidebar-user').textContent = username;
    showApp();
  } catch(err) {
    statusEl.style.display = 'none';
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('#main-content > div[id^="tab-"]').forEach(el => el.style.display = 'none');
  const tabNames = {overview:'Overview', iptables:'iptables', services:'Services', docker:'Docker'};
  document.getElementById('main-header').textContent = tabNames[tab] || tab;
  const tabEl = document.getElementById('tab-' + tab);
  if (tabEl) tabEl.style.display = 'block';
  if (dockerInterval) { clearInterval(dockerInterval); dockerInterval = null; }
  if (tab === 'overview') loadOverview();
  if (tab === 'iptables') loadIptables();
  if (tab === 'services') loadService();
  if (tab === 'docker') { loadDocker(); dockerInterval = setInterval(loadDocker, 5000); }
}

// Overview
async function loadOverview() {
  const el = document.getElementById('tab-overview');
  el.innerHTML = '<div style="text-align:center;padding:40px"><span class="spinner"></span> Loading...</div>';
  try {
    const res = await fetch('/api/overview?token=' + encodeURIComponent(authToken));
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    el.innerHTML = '<div class="overview-grid">' +
      card('Hostname', data.hostname) +
      card('Kernel', data.kernel) +
      card('Uptime', data.uptime) +
      card('Memory', data.memory) +
      card('Disk Usage', data.disk) +
      card('Top Processes (by mem)', data.top_processes) +
    '</div>';
  } catch(e) {
    el.innerHTML = '<div style="color:var(--accent);padding:20px">Failed to load overview: ' + e.message + '</div>';
  }
  function card(title, content) {
    return '<div class="overview-card"><h3>' + title + '</h3><pre>' + escapeHtml(content) + '</pre></div>';
  }
}

// iptables
let iptablesEditContext = null;
let iptablesInterfaces = [];
const chainFormConfig = {
  'nat/PREROUTING':  { showIn:1, showOut:0, showPorts:0, showTo:1, toLbl:'DNAT target (--to-destination)', defTarget:'DNAT' },
  'nat/INPUT':       { showIn:1, showOut:0, showPorts:1, showTo:0, defTarget:'' },
  'nat/OUTPUT':      { showIn:0, showOut:1, showPorts:1, showTo:1, toLbl:'SNAT target (--to-source)', defTarget:'SNAT' },
  'nat/POSTROUTING': { showIn:0, showOut:1, showPorts:0, showTo:1, toLbl:'SNAT/MASQ target (--to-source)', defTarget:'MASQUERADE' },
  'filter/INPUT':    { showIn:1, showOut:0, showPorts:1, showTo:0, defTarget:'' },
  'filter/FORWARD':  { showIn:1, showOut:1, showPorts:1, showTo:0, defTarget:'' },
  'filter/OUTPUT':   { showIn:0, showOut:1, showPorts:1, showTo:0, defTarget:'' },
};

function setFormFields(table, chain) {
  const c = chainFormConfig[table+'/'+chain] || { showIn:1, showOut:1, showPorts:1, showTo:0, defTarget:'' };
  document.getElementById('ipt-form-in-row').style.display = c.showIn ? 'flex' : 'none';
  document.getElementById('ipt-form-out-row').style.display = c.showOut ? 'flex' : 'none';
  document.getElementById('ipt-form-port-row').style.display = c.showPorts ? 'flex' : 'none';
  const toRow = document.getElementById('ipt-form-to-row');
  toRow.style.display = c.showTo ? 'flex' : 'none';
  if (c.showTo) document.getElementById('ipt-form-to-label').textContent = c.toLbl;
  if (c.defTarget && !document.getElementById('ipt-form-target').value) {
    document.getElementById('ipt-form-target').value = c.defTarget;
  }
}

function populateInterfaces() {
  ['ipt-form-in','ipt-form-out'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const v = sel.value;
    sel.innerHTML = '<option value="">any</option>';
    iptablesInterfaces.forEach(iface => {
      const o = document.createElement('option');
      o.value = iface;
      o.textContent = iface;
      if (iface === v) o.selected = true;
      sel.appendChild(o);
    });
  });
}

function renderChainGroup(containerId, table, chains, chainOrder) {
  const container = document.getElementById(containerId);

  for (const name of chainOrder) {

    html += '<div class="chain-card">';
    html += '<div class="chain-header"><span>' + name + '</span>';
    html += '<div class="chain-actions">';
    html += '<button class="add-btn" onclick="openAddForm(\'' + table + '\',\'' + name + '\')">+ Add</button>';
    html += '</div></div>';

      html += '<div class="iptables-empty">No rules</div>';
    } else {
      html += '<table class="rule-table"><thead><tr>';
      html += '<th>#</th><th>pkts</th><th>bytes</th><th>target</th><th>prot</th><th>in</th><th>out</th><th>source</th><th>destination</th><th>extra</th><th class="col-edit"></th>';
      html += '</tr></thead><tbody>';
      for (const r of rules) {
        const cls = 'rule-target-' + r.target;
        html += '<tr>';
        html += '<td>' + r.num + '</td>';
        html += '<td>' + r.pkts + '</td>';
        html += '<td>' + r.bytes + '</td>';
        html += '<td class="col-target ' + cls + '">' + r.target + '</td>';
        html += '<td>' + r.prot + '</td>';
        html += '<td>' + r.in + '</td>';
        html += '<td>' + r.out + '</td>';
        html += '<td>' + r.source + '</td>';
        html += '<td>' + r.destination + '</td>';
        html += '<td style="color:var(--text2)">' + escapeHtml(r.extra) + '</td>';
        html += '<td class="col-edit"><button class="edit-btn" onclick="openEditForm(\'' + table + '\',\'' + name + '\',' + r.num + ',\'' + escapeAttr(r.target) + '\',\'' + escapeAttr(r.prot) + '\',\'' + escapeAttr(r.in) + '\',\'' + escapeAttr(r.out) + '\',\'' + escapeAttr(r.source) + '\',\'' + escapeAttr(r.destination) + '\',\'' + escapeAttr(r.extra) + '\')">Edit</button></td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
    }

}

function escapeAttr(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function openAddForm(table, chain) {
  iptablesEditContext = { mode:'add', table, chain, line:0 };
  document.getElementById('ipt-form-title').textContent = 'Add Rule — ' + table + '/' + chain;
  ['src','dst','dport','sport','to','extra'].forEach(id => document.getElementById('ipt-form-'+id).value = '');
  document.getElementById('ipt-form-target').value = '';
  document.getElementById('ipt-form-proto').value = '';
  setFormFields(table, chain);
  populateInterfaces();
  document.getElementById('ipt-form-delete').style.display = 'none';
  document.getElementById('ipt-form-note').textContent = '';
  showIptablesForm();
}

function openEditForm(table, chain, line, target, prot, inIf, outIf, src, dst, extra) {
  iptablesEditContext = { mode:'edit', table, chain, line };
  document.getElementById('ipt-form-title').textContent = 'Edit Rule #' + line + ' — ' + table + '/' + chain;
  setFormFields(table, chain);
  populateInterfaces();
  const u = s => s === '*' ? '' : unescapeAttr(s);
  document.getElementById('ipt-form-src').value = u(src);
  document.getElementById('ipt-form-dst').value = u(dst);
  document.getElementById('ipt-form-in').value = u(inIf);
  document.getElementById('ipt-form-out').value = u(outIf);
  document.getElementById('ipt-form-target').value = unescapeAttr(target);
  document.getElementById('ipt-form-proto').value = unescapeAttr(prot) === 'all' ? 'all' : unescapeAttr(prot);
  document.getElementById('ipt-form-to').value = '';
  document.getElementById('ipt-form-sport').value = '';
  document.getElementById('ipt-form-dport').value = '';
  let extraStr = unescapeAttr(extra);
  const dpm = extraStr.match(/(?:^|\s)(tcp|udp) dpt:(\S+)/);
  if (dpm) { document.getElementById('ipt-form-dport').value = dpm[2]; extraStr = extraStr.replace(dpm[0], ''); }
  const spm = extraStr.match(/(?:^|\s)(tcp|udp) spt:(\S+)/);
  if (spm) { document.getElementById('ipt-form-sport').value = spm[2]; extraStr = extraStr.replace(spm[0], ''); }
  const tom = extraStr.match(/to:\S+/);
  if (tom) { document.getElementById('ipt-form-to').value = tom[0]; extraStr = extraStr.replace(tom[0], ''); }
  document.getElementById('ipt-form-extra').value = extraStr.trim();
  document.getElementById('ipt-form-delete').style.display = 'inline-block';
  document.getElementById('ipt-form-note').textContent = '';
  showIptablesForm();
}

function unescapeAttr(s) {
  if (!s) return '';
  return s.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');
}

function showIptablesForm() {
  document.getElementById('ipt-form-overlay').classList.add('show');
}

function closeIptablesForm() {
  document.getElementById('ipt-form-overlay').classList.remove('show');
  iptablesEditContext = null;
}

function getRuleFromForm() {
  const f = id => document.getElementById('ipt-form-'+id);
  const target = f('target').value;
  const proto = f('proto').value;
  const src = f('src').value.trim();
  const dst = f('dst').value.trim();
  const inIf = f('in').value;
  const outIf = f('out').value;
  const dport = f('dport').value.trim();
  const sport = f('sport').value.trim();
  const toVal = f('to').value.trim();
  const extra = f('extra').value.trim();
  let rule = '';
  if (proto && proto !== 'all') rule += '-p ' + proto + ' ';
  if (src) rule += '-s ' + src + ' ';
  if (dst) rule += '-d ' + dst + ' ';
  if (inIf) rule += '-i ' + inIf + ' ';
  if (outIf) rule += '-o ' + outIf + ' ';
  if (dport) rule += '--dport ' + dport + ' ';
  if (sport) rule += '--sport ' + sport + ' ';
  if (extra) rule += extra + ' ';
  if (target) rule += '-j ' + target + ' ';
  if (toVal) {
    const dest = toVal.replace(/^to:\s*/i, '');
    const isSnat = target === 'SNAT' || target === 'MASQUERADE';
    rule += (isSnat ? '--to-source ' : '--to-destination ') + dest + ' ';
  }
  return rule.trim();
}

async function submitIptablesForm() {
  const ctx = iptablesEditContext;
  if (!ctx) return;
  const noteEl = document.getElementById('ipt-form-note');
  const rule = getRuleFromForm();
  if (!rule) { noteEl.textContent = 'Rule cannot be empty'; return; }
  try {
    if (ctx.mode === 'add') {
      const fd = new FormData();
      fd.append('token', authToken);
      fd.append('table', ctx.table);
      fd.append('chain', ctx.chain);
      fd.append('position', '0');
      fd.append('rule', rule);
      const res = await fetch('/api/iptables', { method:'POST', body:fd });
      const d = await res.json();
      if (!d.success) { noteEl.textContent = 'Error: ' + d.error; return; }
    } else {
      const fd = new FormData();
      fd.append('token', authToken);
      fd.append('table', ctx.table);
      fd.append('chain', ctx.chain);
      fd.append('line', ctx.line.toString());
      fd.append('rule', rule);
      const res = await fetch('/api/iptables', { method:'PUT', body:fd });
      const d = await res.json();
      if (!d.success) { noteEl.textContent = 'Error: ' + d.error; return; }
    }
    closeIptablesForm();
    refreshIptables();
  } catch(e) { noteEl.textContent = 'Error: ' + e.message; }
}

async function deleteFromForm() {
  const ctx = iptablesEditContext;
  if (!ctx || ctx.mode !== 'edit') return;
  if (!confirm('Delete rule #' + ctx.line + ' from ' + ctx.table + '/' + ctx.chain + '?')) return;
  try {
    const res = await fetch('/api/iptables?token=' + encodeURIComponent(authToken) +
      '&table=' + ctx.table + '&chain=' + ctx.chain + '&line=' + ctx.line, { method:'DELETE' });
    const d = await res.json();
    if (!d.success) { document.getElementById('ipt-form-note').textContent = 'Error: ' + d.error; return; }
    closeIptablesForm();
    refreshIptables();
  } catch(e) { document.getElementById('ipt-form-note').textContent = 'Error: ' + e.message; }
}

  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

      html += '<td><span class="svc-check ' + (isEnabled ? 'yes' : 'no') + '">' + (isEnabled ? '\u2713' : '\u2717') + '</span></td>';
      html += '<td style="color:var(--text2);font-size:12px">' + memStr + '</td>';

      html += '<div class="svc-drop-menu" id="svc-drop-' + safeId + '">';
      html += '<div class="svc-drop-item" onclick="svcAction(\'' + svc.name + '\',\'restart\')">Restart</div>';

        html += '<div class="svc-drop-item" onclick="svcAction(\'' + svc.name + '\',\'stop\')">Stop</div>';
      } else {
        html += '<div class="svc-drop-item" onclick="svcAction(\'' + svc.name + '\',\'start\')">Start</div>';
      }
      html += '<div class="svc-drop-sep"></div>';
      if (isEnabled) {
        html += '<div class="svc-drop-item" onclick="svcAction(\'' + svc.name + '\',\'disable\')">Disable</div>';
      } else {
        html += '<div class="svc-drop-item" onclick="svcAction(\'' + svc.name + '\',\'enable\')">Enable</div>';
      }
      html += '<div class="svc-drop-sep"></div>';
      html += '<div class="svc-drop-item" onclick="toggleServiceConfig(\'' + svc.name + '\')">Show Config</div>';
      html += '<div class="svc-drop-item danger" onclick="removeService(\'' + svc.name + '\')">Remove</div>';
      html += '</div></div></td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="svc-empty" style="color:var(--accent)">Error: ' + escapeHtml(e.message) + '</div>';

}

  try {
    const [availRes, monRes] = await Promise.all([
      fetch('/api/services/available?token=' + encodeURIComponent(authToken)),
      fetch('/api/services/monitored?token=' + encodeURIComponent(authToken))
    ]);
    if (!availRes.ok || !monRes.ok) throw new Error('Failed to load');
    const availData = await availRes.json();
    const monData = await monRes.json();
    const monitoredNames = new Set(monData.services.map(s => s.name));

    renderServiceModalList('');

    html += '<div class="svc-modal-item' + (s.monitored ? ' svc-already' : '') + '">';

async function loadDocker() {
  const el = document.getElementById('tab-docker');

  if (!el.querySelector('#docker-table-wrap')) {
    el.innerHTML = `
      <div class="svc-controls">

      </div>
      <div id="docker-table-wrap"></div>
      <div id="docker-config-area"></div>
    `;

    dockerFirstLoad = true;
  }
  const wrap = document.getElementById('docker-table-wrap');
  if (!wrap) return;
  try {
    const res = await fetch('/api/docker/containers?token=' + encodeURIComponent(authToken));
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    if (!data.containers.length) {
      wrap.innerHTML = '<div class="docker-empty">No Docker containers found.</div>';
      dockerFirstLoad = true;
      return;
    }
    if (dockerFirstLoad || !wrap.querySelector('.svc-table')) {
      renderDockerTable(wrap, data.containers);
      dockerFirstLoad = false;
      return;
    }
    const existingRows = wrap.querySelectorAll('tbody tr[data-name]');
    const existingNames = new Set();
    for (const row of existingRows) existingNames.add(row.dataset.name);
    const newNames = new Set(data.containers.map(c => c.name));
    for (const row of existingRows) {
      if (!newNames.has(row.dataset.name)) { row.remove(); continue; }
      const c = data.containers.find(x => x.name === row.dataset.name);
      if (!c) continue;
      const isRunning = c.state === 'running';
      const stateClass = c.state === 'running' ? 'running' : c.state === 'exited' ? 'exited' : c.state === 'paused' ? 'paused' : 'created';
      const memStr = c.mem_usage ? c.mem_usage + ' (' + c.mem_perc + ')' : '\u2014';
      const cpuStr = c.cpu_perc || '\u2014';
      row.querySelector('.dk-state').className = 'docker-state ' + stateClass;
      row.querySelector('.dk-state').textContent = c.state;
      row.querySelector('.dk-status').textContent = c.status;
      row.querySelector('.dk-mem').textContent = memStr;
      row.querySelector('.dk-cpu').textContent = cpuStr;
      const dropItems = row.querySelector('.svc-drop-menu');
      if (isRunning) {
        dropItems.innerHTML = '<div class="svc-drop-item" onclick="dockerAction(\'' + c.name + '\',\'stop\')">Stop</div><div class="svc-drop-sep"></div><div class="svc-drop-item" onclick="toggleDockerConfig(\'' + escapeAttr(c.name) + '\')">View Config</div>';
      } else {
        dropItems.innerHTML = '<div class="svc-drop-item" onclick="dockerAction(\'' + c.name + '\',\'start\')">Start</div><div class="svc-drop-sep"></div><div class="svc-drop-item" onclick="toggleDockerConfig(\'' + escapeAttr(c.name) + '\')">View Config</div>';
      }
    }
    for (const c of data.containers) {
      if (!existingNames.has(c.name)) {
        const tbody = wrap.querySelector('tbody');
        tbody.insertAdjacentHTML('beforeend', buildDockerRow(c));
      }
    }
  } catch(e) {
    if (dockerFirstLoad) wrap.innerHTML = '<div class="docker-empty" style="color:var(--accent)">Error: ' + escapeHtml(e.message) + '</div>';
  }
}

function buildDockerRow(c) {
  const isRunning = c.state === 'running';
  const stateClass = c.state === 'running' ? 'running' : c.state === 'exited' ? 'exited' : c.state === 'paused' ? 'paused' : 'created';
  const memStr = c.mem_usage ? c.mem_usage + ' (' + c.mem_perc + ')' : '\u2014';
  const cpuStr = c.cpu_perc || '\u2014';
  const safeId = 'dk_' + c.name.replace(/[^a-zA-Z0-9]/g, '_');
  let html = '<tr data-name="' + escapeAttr(c.name) + '">';
  html += '<td><div class="svc-td-name">' + escapeHtml(c.name) + '</div>';
  if (c.ports) html += '<div class="svc-td-desc">' + escapeHtml(c.ports) + '</div>';
  html += '</td>';
  html += '<td style="font-size:12px;color:var(--text2)">' + escapeHtml(c.image) + '</td>';
  html += '<td><span class="docker-state dk-state ' + stateClass + '">' + escapeHtml(c.state) + '</span>';
  html += '<div class="dk-status" style="font-size:10px;color:var(--text2);margin-top:2px">' + escapeHtml(c.status) + '</div></td>';
  html += '<td class="dk-mem" style="font-size:12px;color:var(--text2)">' + memStr + '</td>';
  html += '<td class="dk-cpu" style="font-size:12px;color:var(--text2)">' + cpuStr + '</td>';
  html += '<td style="text-align:right"><div class="svc-drop-wrap">';
  html += '<button class="svc-drop-btn" onclick="toggleDropdown(event,\'' + safeId + '\')">Actions <span class="arrow">\u25be</span></button>';
  html += '<div class="svc-drop-menu" id="svc-drop-' + safeId + '">';
  if (isRunning) {
    html += '<div class="svc-drop-item" onclick="dockerAction(\'' + c.name + '\',\'stop\')">Stop</div>';
  } else {
    html += '<div class="svc-drop-item" onclick="dockerAction(\'' + c.name + '\',\'start\')">Start</div>';
  }
  html += '<div class="svc-drop-sep"></div>';
  html += '<div class="svc-drop-item" onclick="toggleDockerConfig(\'' + escapeAttr(c.name) + '\')">View Config</div>';
  html += '</div></div></td>';
  html += '</tr>';
  return html;
}

function renderDockerTable(wrap, containers) {
  let html = '<table class="svc-table"><thead><tr>';
  html += '<th>Container</th><th>Image</th><th>State</th><th>RAM</th><th>CPU</th><th></th>';
  html += '</tr></thead><tbody>';
  for (const c of containers) html += buildDockerRow(c);
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

async function dockerAction(name, action) {
  try {
    const res = await fetch('/api/docker/containers/' + encodeURIComponent(name) + '/' + action + '?token=' + encodeURIComponent(authToken), { method: 'POST' });
    const d = await res.json();
    if (!d.success && d.error) alert('Error: ' + d.error);
    dockerFirstLoad = true;
    loadDocker();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

async function toggleDockerConfig(name) {
  const el = document.getElementById('docker-config-area');
  if (el.dataset.current === name) {
    el.innerHTML = '';
    el.dataset.current = '';
    return;
  }
  el.dataset.current = name;
  el.innerHTML = '<div class="docker-config show"><pre style="color:var(--text2)"><span class="spinner"></span> Loading config for ' + escapeHtml(name) + '...</pre></div>';
  try {
    const res = await fetch('/api/docker/containers/' + encodeURIComponent(name) + '/inspect?token=' + encodeURIComponent(authToken));
    if (!res.ok) throw new Error('Failed to load config');
    const data = await res.json();
    if (data.error) {
      el.innerHTML = '<div class="docker-config show"><pre style="color:var(--accent)">' + escapeHtml(data.error) + '</pre></div>';
    } else {
      el.innerHTML = '<div class="docker-config show"><pre>' + escapeHtml(data.config) + '</pre></div>';
    }
  } catch(e) {
    el.innerHTML = '<div class="docker-config show"><pre style="color:var(--accent)">Error: ' + escapeHtml(e.message) + '</pre></div>';
  }
}

// Event listeners
document.getElementById('login-btn').addEventListener('click', () => {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  if (!u || !p) {
    document.getElementById('login-error').textContent = 'Username and password required';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  document.getElementById('login-error').style.display = 'none';
  doLogin(u, p);
});

document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => switchTab(el.dataset.tab));
});

document.getElementById('sidebar-logout').addEventListener('click', () => {
  authToken = null;
  localStorage.removeItem('vpsm_token');
  showLogin();
});

checkAuth();
</script>
